<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo de Adivinhação</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>🎯 Jogo de Adivinhação</h1>
      <p class="description">
        Estou pensando em um número entre <strong>1 e 100</strong>.
        Você tem <strong>10 tentativas</strong> para descobrir qual é.
      </p>

      <div class="input-group">
        <input type="number" id="palpite" placeholder="Digite um número" min="1" max="100">
        <button id="btnChutar">Chutar</button>
      </div>

      <p id="mensagem" class="mensagem info">Boa sorte!</p>
      <p class="tentativas">Tentativas restantes: <span id="restantes">10</span></p>
      <button id="btnReiniciar" class="reiniciar hidden">Jogar novamente</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
